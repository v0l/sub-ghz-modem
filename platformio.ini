; sub-ghz-modem: LoRa / FSK / OOK / LR-FHSS radio driven over a serial line.
;
; T-Beam        = ESP32     + SX1276 or SX1262
; T-Echo        = nRF52840  + SX1262 only
; Nucleo-WL55JC = STM32WL55 + on-die SX126x core

[common]
build_flags =
    -DMODEM_SERIAL_BAUD=115200
lib_deps =
    https://github.com/v0l/RadioLib.git#fix-ax25-nrzi-7.7.1

; ------------------------------------------------------------------ T-Beam

[tbeam]
platform = espressif32@6.9.0
board = ttgo-t-beam
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags = ${common.build_flags} -DBOARD_TBEAM -DCORE_DEBUG_LEVEL=0 -DENABLE_DISPLAY
lib_deps =
    ${common.lib_deps}
    lewisxhe/XPowersLib@^0.2.7
    adafruit/Adafruit SSD1306@^2.5.13
    adafruit/Adafruit GFX Library@^1.11.11

[env:tbeam-sx1276]
extends = tbeam
build_flags = ${tbeam.build_flags} -DRADIO_SX1276

[env:tbeam-sx1262]
extends = tbeam
build_flags = ${tbeam.build_flags} -DRADIO_SX1262

; Modem protocol on UART2 (GPIO25 TX / GPIO14 RX), USB stays free for logs.
[env:tbeam-sx1276-uart2]
extends = tbeam
build_flags = ${tbeam.build_flags} -DRADIO_SX1276 -DMODEM_USE_UART2

[env:tbeam-sx1262-uart2]
extends = tbeam
build_flags = ${tbeam.build_flags} -DRADIO_SX1262 -DMODEM_USE_UART2

; Adds LR-FHSS (SX1262 only, transmit only). Opt-in because the RadioLib
; LR-FHSS API is newer and has moved between releases.
[env:tbeam-sx1262-lrfhss]
extends = tbeam
build_flags = ${tbeam.build_flags} -DRADIO_SX1262 -DENABLE_LRFHSS

; ------------------------------------------------------------------ T-Echo

[techo]
platform = nordicnrf52@10.12.0
board = t-echo
framework = arduino
monitor_speed = 115200
upload_protocol = nrfutil
build_flags = ${common.build_flags} -DBOARD_TECHO -DRADIO_SX1262 -Wl,-u,_printf_float
    -DENABLE_DISPLAY
lib_deps =
    ${common.lib_deps}
    zinggjm/GxEPD2@^1.6.2
    adafruit/Adafruit GFX Library@^1.11.11

[env:techo]
extends = techo

[env:techo-lrfhss]
extends = techo
build_flags = ${techo.build_flags} -DENABLE_LRFHSS

; ------------------------------------------------------------------ Nucleo-WL55JC

[wl55]
platform = ststm32@20.0.0
; RadioLib 7.7.1 still targets the classic stm32duino API. Core 3.x switched to
; ArduinoCore-API, whose typed PinMode/PinStatus break its STM32WL HAL.
platform_packages = platformio/framework-arduinoststm32@4.21200.0
board = nucleo_wl55jc
framework = arduino
monitor_speed = 115200
upload_protocol = stlink
lib_ldf_mode = deep+
; RadioLib includes SubGhz.h from its own sources, and PlatformIO does not pass
; a sibling library's include path into a dependency's build. Name it directly.
build_flags = ${common.build_flags} -DBOARD_NUCLEO_WL55 -DRADIO_STM32WLX -Wl,-u,_printf_float
    -I${platformio.packages_dir}/framework-arduinoststm32@4.21200.0/libraries/SubGhz/src
; SubGhz and EEPROM ship with the core, but the LDF only reaches them if they
; are named: RadioLib pulls SubGhz in from a file the initial scan never sees.
lib_deps =
    ${common.lib_deps}
    SubGhz
    EEPROM

[env:wl55]
extends = wl55

; NUCLEO-WL55JC2: 430-510 MHz front end. Check the sticker on the RF shield.
[env:wl55-lowband]
extends = wl55
build_flags = ${wl55.build_flags} -DWL55_LOW_BAND

[env:wl55-lrfhss]
extends = wl55
build_flags = ${wl55.build_flags} -DENABLE_LRFHSS
